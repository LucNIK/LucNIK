name: GitHub Languages

on:
  schedule:
    - cron: "0 */12 * * *" # twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Languages across ALL repositories owned by LucNIK (private ones included with a repo-scoped token)
      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LucNIK
          filename: dist/github-languages.svg
          template: classic
          committer_message: "Update ${filename}"
          base: ""
          config_timezone: Asia/Shanghai
          config_padding: 0,8,0,8
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 12
          plugin_languages_threshold: 0%
          plugin_languages_colors: github
