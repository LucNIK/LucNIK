name: Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/pacman.yml"]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man contribution graph (light + dark)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: LucNIK
          games: pacman
          player_style: opportunistic

      # Publishes dist/pacman-contribution-graph.svg and -dark.svg to the "output" branch
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
